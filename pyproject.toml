[project]
name = "secretary-bot"
version = "0.1.0"
description = "Personal Telegram secretary bot powered by OpenRouter LLMs via Telegram Business / Secretary Mode."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[ext]>=22.5",
    "openai>=2.11.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secretary"]
