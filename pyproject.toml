[project]
name = "tg-secretary"
version = "1.0.0"
description = "Personal Telegram Business autoresponder: LLM replies in your voice, per-contact memory, voice transcription, human-in-the-loop approval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[ext]>=22.8,<23",
    "openai>=3.24,<4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "anthropic>=1.0",
]

[project.urls]
Homepage = "https://github.com/sepehr071/tg-secretary"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secretary", "hosting"]
