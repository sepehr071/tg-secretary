<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="tg-secretary: a Telegram autoresponder that answers as you">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15132b"/>
      <stop offset="0.55" stop-color="#231f4a"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7dff"/>
      <stop offset="0.5" stop-color="#5fc9ff"/>
      <stop offset="1" stop-color="#d3a6ff"/>
    </linearGradient>
    <linearGradient id="me" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b52e8"/>
      <stop offset="1" stop-color="#5fc9ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6b52e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6b52e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fc9ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5fc9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="260" fill="url(#glow1)"/>
  <circle cx="160" cy="320" r="220" fill="url(#glow2)"/>

  <!-- orb mark -->
  <circle cx="112" cy="118" r="44" fill="url(#orb)"/>
  <circle cx="98" cy="104" r="16" fill="#ffffff" fill-opacity="0.35" filter="url(#soft)"/>

  <!-- title -->
  <text x="180" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">tg-secretary</text>
  <text x="182" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c9c6ef">Your Telegram answers itself, in your voice, while you are away.</text>

  <!-- feature pills -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e9e7ff">
    <rect x="182" y="186" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="277" y="208" text-anchor="middle">Telegram Business</text>
    <rect x="384" y="186" width="212" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="490" y="208" text-anchor="middle">Persona per relationship</text>
    <rect x="608" y="186" width="178" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="697" y="208" text-anchor="middle">Memory that grows</text>
    <rect x="798" y="186" width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="898" y="208" text-anchor="middle">Human-in-the-loop</text>
  </g>

  <!-- chat sample -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
    <rect x="182" y="246" width="330" height="40" rx="18" fill="#ffffff" fill-opacity="0.92"/>
    <text x="200" y="272" fill="#1c1b2e">hey, free tomorrow evening?</text>
    <rect x="544" y="246" width="454" height="40" rx="18" fill="url(#me)"/>
    <text x="562" y="272" fill="#ffffff">working till 6, free after 7. does 7 work?</text>
    <text x="1010" y="272" fill="#9fd8ff" font-size="13">✦ sent for you, 30s later</text>
  </g>

  <text x="1246" y="320" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8c89b8">github.com/sepehr071/tg-secretary</text>
</svg>
