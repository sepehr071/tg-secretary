<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173f3a">
<title>{% block title %}منشی تلگرام{% endblock %}</title>
<link rel="stylesheet" href="/hstatic/style.css">
<script src="/hstatic/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">منشی تلگرام</a>
  {% if user %}
  <nav class="top-nav">
    <a href="/account">حساب کاربری</a>
    <form method="post" action="/logout"><button class="link">خروج</button></form>
  </nav>
  {% endif %}
</header>
<main class="{% block main_class %}page{% endblock %}">
  {% if msg %}<p class="flash ok" role="status" dir="auto">{{ msg }}</p>{% endif %}
  {% if err %}<p class="flash err" role="alert" dir="auto">{{ err }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
